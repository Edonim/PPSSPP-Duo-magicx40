name: Manual Generate Android APK
on:
  workflow_dispatch:
    inputs:
      buildVariant:
        type: choice
        description: 'PPSSPP Duo build variant'
        required: true
        default: 'DuoOptimized'
        options:
          - DuoOptimized
          - DuoDebug

jobs:
  apk:
    name: Generate ${{ github.event.inputs.buildVariant }} APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Assemble APK
        run: ./gradlew :android:assemble${{ github.event.inputs.buildVariant }} --stacktrace

      - name: Package build
        shell: bash
        run: |
          mkdir -p ppsspp
          find android/build/outputs/apk -type f -name '*.apk' -print -exec cp '{}' ppsspp/ \;
          test -n "$(find ppsspp -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ github.event.inputs.buildVariant }}-build
          path: ppsspp/*.apk
